<!--designing the basic structure of page-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="css/styles.css"> <!--connecting css with html for designing-->
    <script src="javas/registration.js" defer></script> <!--defer in html to load an external javascript file without blocking html parsing-->
</head>
<body id="registration-page">
        <form id="registration">
        <h1 class="registration-page-heading">Create an Account</h1>

        <div class="required-userdata-container">
        <label for="email"> Email</label>
        <input type="email" id="email" placeholder= "Email" required>

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="username" required>

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="age">

        <label for="address">Address</label>
        <input type="text" id="address" placeholder="address">

        <label for="number">Phone Number</label>
        <input type="number" id="phone-number" placeholder="phone-number">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="password" required>

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirmpassword" placeholder="Re-enter your password" required>


        <button type="submit" class="submit">Create an Account</button>
        <p id="message"></p>
        <p id="not-account">already have an account?
             <a href="login.html">Login Here</a>  <!--nevigation to registration page-->
            </p>
        <button id="hidden-login-button" type="button" hidden>LogIn Please</button>
        </div>
    </form>
    
</body>
</html>
